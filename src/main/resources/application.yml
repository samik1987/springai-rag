server:
  port: 8081

spring:
  datasource:
    url: jdbc:mariadb://localhost:3308/springai
    username: root
    password: my-secure-password
  ai:
    openai:
      api-key: ${api-key}
      chat:
        options:
          model: gpt-5-mini
      embedding:
        options:
          model: text-embedding-ada-002
    vectorstore:
      mariadb:
        initialize-schema: true
        distance-type: COSINE
        dimensions: 1536
        table-name: ragstore


logging:
  level:
    org.springframework.ai: DEBUG
    org.springframework.ai.chat.client.advisor: DEBUG